# finsec-term Configuration
refresh_interval: 15m
request_timeout: 14s
max_items_per_feed: 60
cache_file: ~/.finsec-term/cache.json

# Fixer.io Configuration (Free tier: 100 req/month, cached for 72h / 3 days = ~10 req/month)
fixer:
  api_key: "" # Masukkan Fixer API key kamu di sini (opsional)
  cache_duration: 72h

feeds:
  pane1_cve:
    - name: "CISA KEV"
      url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
      type: "cisa"
    - name: "BleepingComputer"
      url: "https://www.bleepingcomputer.com/feed/"
      type: "rss"
    - name: "The Hacker News"
      url: "https://feeds.feedburner.com/TheHackersNews"
      type: "rss"
    - name: "SecurityWeek"
      url: "https://feeds.feedburner.com/securityweek"
      type: "rss"
    - name: "Google Cloud Sec"
      url: "https://cloudblog.withgoogle.com/products/identity-security/rss/"
      type: "rss"
    - name: "The Verge Tech"
      url: "https://www.theverge.com/rss/index.xml"
      type: "rss"
    - name: "Ars Technica"
      url: "https://feeds.arstechnica.com/arstechnica/index"
      type: "rss"
    - name: "Hacker News"
      url: "https://news.ycombinator.com/rss"
      type: "rss"
    - name: "TechCrunch"
      url: "https://techcrunch.com/feed/"
      type: "rss"
    - name: "GitHub Blog"
      url: "https://github.blog/feed/"
      type: "rss"

  pane2_global_macro:
    - name: "CNBC Markets"
      url: "https://search.cnbc.com/rs/search/view.html?partnerId=2000&keywords=markets&sort=date&type=all&output=rss"
      type: "rss"
    - name: "CNBC Economy"
      url: "https://search.cnbc.com/rs/search/view.html?partnerId=2000&keywords=economy&sort=date&type=all&output=rss"
      type: "rss"
    - name: "Investing.com"
      url: "https://www.investing.com/rss/news.rss"
      type: "rss"
    - name: "FXStreet"
      url: "https://www.fxstreet.com/rss/news"
      type: "rss"
    - name: "CoinDesk"
      url: "https://www.coindesk.com/arc/outboundfeeds/rss/"
      type: "rss"

  pane3_id_macro:
    - name: "CNBC ID Market"
      url: "https://www.cnbcindonesia.com/market/rss"
      type: "rss"
    - name: "CNBC ID News"
      url: "https://www.cnbcindonesia.com/news/rss"
      type: "rss"
    - name: "Antara Ekonomi"
      url: "https://www.antaranews.com/rss/ekonomi.xml"
      type: "rss"
    - name: "Bisnis.com Market"
      url: "https://rss.bisnis.com/market"
      type: "rss"
    - name: "Kontan Investasi"
      url: "https://rss.kontan.co.id/news/investasi"
      type: "rss"

