name: Release Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Windows
          - goos: windows
            goarch: amd64
            bin_term: finsec-term-windows-amd64.exe
            bin_web: finsec-web-windows-amd64.exe
          # Linux
          - goos: linux
            goarch: amd64
            bin_term: finsec-term-linux-amd64
            bin_web: finsec-web-linux-amd64
          - goos: linux
            goarch: arm64
            bin_term: finsec-term-linux-arm64
            bin_web: finsec-web-linux-arm64
          # macOS (Darwin)
          - goos: darwin
            goarch: amd64
            bin_term: finsec-term-darwin-amd64
            bin_web: finsec-web-darwin-amd64
          - goos: darwin
            goarch: arm64
            bin_term: finsec-term-darwin-arm64
            bin_web: finsec-web-darwin-arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Compile Binaries (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o dist/${{ matrix.bin_term }} ./cmd/finsec-term
          go build -ldflags="-s -w" -o dist/${{ matrix.bin_web }} ./cmd/finsec-web

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/${{ matrix.bin_term }}
            dist/${{ matrix.bin_web }}
            config.example.yaml
