<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FINSEC-TERM // Threat & Macro Intelligence Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=1.0.1">
</head>
<body>

  <!-- TOP HEADER -->
  <header class="top-header">
    <div class="brand-section">
      <div class="brand-title">
        <span>FINSEC-TERM</span>
        <span class="brand-tag">WEB TERMINAL</span>
      </div>
      <div class="clock-display">
        <span id="clock-utc" class="clock-utc">UTC 00:00:00</span>
        <span>//</span>
        <span id="clock-wib" class="clock-wib">WIB 00:00:00</span>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat-pill" id="stat-total">0 ITEMS</div>
      <div class="stat-pill unread" id="stat-unread">0 UNREAD</div>
      <div class="stat-pill crit" id="stat-crit">0 CRITICAL</div>
      <div class="stat-pill" id="sync-status">● LIVE</div>
    </div>

    <div class="header-controls">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search CVE, keyword, source...">
        <span class="search-shortcut">/</span>
      </div>
      <button class="btn-action" id="btn-sort" title="Toggle Sort Order">
        <span id="sort-icon">⏱️</span> <span id="sort-text">LATEST FIRST</span>
      </button>
      <button class="btn-action sync-btn" id="btn-sync" title="Shortcut: R">
        <span>↻</span> SYNC NOW
      </button>
      <button class="btn-action" id="btn-mark-all" title="Shortcut: M">
        <span>✓</span> MARK READ
      </button>
    </div>
  </header>

  <!-- 3-PANE BLOOMBERG GRID -->
  <main class="main-grid">
    
    <!-- PANE 1: CVE & TECH RADAR -->
    <section class="pane-column" id="pane-1">
      <div class="pane-header">
        <div class="pane-title-wrap">
          <span class="pane-num">[1]</span>
          <span class="pane-title">CVE & STACK RADAR</span>
          <span class="pane-count" id="count-pane1">0</span>
        </div>
      </div>
      <div class="feed-list" id="list-pane1"></div>
    </section>

    <!-- PANE 2: GLOBAL MACRO & GEOPOLITICS -->
    <section class="pane-column" id="pane-2">
      <div class="pane-header">
        <div class="pane-title-wrap">
          <span class="pane-num">[2]</span>
          <span class="pane-title">GLOBAL MACRO & GEOPOLITICS</span>
          <span class="pane-count" id="count-pane2">0</span>
        </div>
      </div>
      <div class="feed-list" id="list-pane2"></div>
    </section>

    <!-- PANE 3: INDONESIA MARKET, POLITICS & CYBER -->
    <section class="pane-column" id="pane-3">
      <div class="pane-header">
        <div class="pane-title-wrap">
          <span class="pane-num">[3]</span>
          <span class="pane-title">ID MARKET, POLITICS & CYBER</span>
          <span class="pane-count" id="count-pane3">0</span>
        </div>
      </div>
      <div class="feed-list" id="list-pane3"></div>
    </section>

  </main>

  <!-- INSPECTOR DRAWER / SLIDE-OVER -->
  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="inspector-drawer" id="inspector-drawer">
    <div class="drawer-header">
      <span class="drawer-title">[INSPECTOR] INTELLIGENCE DETAIL</span>
      <button class="drawer-close" id="drawer-close" title="Close (Esc)">✕</button>
    </div>
    <div class="drawer-content" id="drawer-content"></div>
    <div class="drawer-footer">
      <span style="font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted);">
        Press <strong style="color:var(--amber)">O</strong> to open link
      </span>
      <a href="#" target="_blank" class="btn-open-link" id="drawer-open-link">
        OPEN SOURCE ARTICLE ↗
      </a>
    </div>
  </aside>

  <script src="app.js?v=1.0.1"></script>
</body>
</html>
